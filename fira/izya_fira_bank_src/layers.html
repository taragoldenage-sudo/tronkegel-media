<!doctype html><html><head><meta charset="utf-8">

<style>html,body{margin:0;background:transparent}</style></head><body><script>
const Q = new URLSearchParams(location.search);
const LAYER = Q.get('layer') || 'fira';
const SIZES = { bg:[1920,1080], table:[1920,1080], end:[1920,1080], fira:[600,1000], izya:[600,1000],
  izya_arm:[380,140], fira_arm:[380,140], flower:[180,280], donut:[180,180], heart:[150,140] };
const [CW, CH] = SIZES[LAYER];
const BASE = !['bg','end','table'].includes(LAYER);

// ---------- helpers (pixel coords, origin top-left) ----------
function poly(pts, col, op=170, bleed=0.12){ brush.noStroke(); brush.noHatch(); if(BASE&&op>=200){ brush.noFill(); brush.wash(col, 255); brush.polygon(pts); brush.noWash(); } brush.fill(col, op); brush.fillBleed(min(bleed,0.04), "out"); brush.polygon(pts); }
function flat(pts, col, op=255){ brush.noStroke(); brush.noFill(); brush.noHatch(); brush.wash(col, op); brush.polygon(pts); brush.noWash(); }
function circ(x,y,r,col,op=170,bleed=0.1){ brush.noStroke(); brush.noHatch(); if(BASE&&op>=200){ brush.noFill(); brush.wash(col,255); brush.circle(x,y,r); brush.noWash(); } brush.fill(col,op); brush.fillBleed(min(bleed,0.04),"out"); brush.circle(x,y,r); }
function fcirc(x,y,r,col,op=255){ brush.noStroke(); brush.noFill(); brush.wash(col,op); brush.circle(x,y,r); brush.noWash(); }
function ln(x1,y1,x2,y2,col="#2a1f1c",w=1,b="HB"){ brush.noFill(); brush.set(b,col,w); brush.line(x1,y1,x2,y2); }
function outline(pts,col="#2a1f1c",w=1,b="HB"){ brush.noFill(); brush.noWash(); brush.set(b,col,w); brush.polygon(pts); brush.noStroke(); }
function ell(cx,cy,rx,ry,n=28,a0=0,a1=TWO_PI){ const p=[]; for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n; p.push([cx+rx*cos(a), cy+ry*sin(a)]);} return p; }
function spl(pts,col,w,b="HB"){ brush.noFill(); brush.set(b,col,w); brush.spline(pts,0.5); }

function torso(cx,neckY,halfW,botW,bot=1000){ const p=[]; const q=(a,b,c,t)=>[(1-t)*(1-t)*a[0]+2*(1-t)*t*b[0]+t*t*c[0],(1-t)*(1-t)*a[1]+2*(1-t)*t*b[1]+t*t*c[1]];
  const L0=[cx-45,neckY], L1=[cx-halfW,neckY+5], L2=[cx-halfW-10,neckY+110];
  for(let i=0;i<=10;i++) p.push(q(L0,L1,L2,i/10)); p.push([cx-botW,bot]); p.push([cx+botW,bot]);
  const R0=[cx+halfW+10,neckY+110], R1=[cx+halfW,neckY+5], R2=[cx+45,neckY]; for(let i=0;i<=10;i++) p.push(q(R0,R1,R2,i/10)); return p; }
// ---------- layers ----------
const L = {};


L.bg = () => {

  flat([[0,0],[1920,0],[1920,1080],[0,1080]], "#f1e2c6");
  poly([[0,0],[1920,0],[1920,1080],[0,1080]], "#e8cfa3", 90, 0.2);

  // окно слева с кружевной занавеской

  poly([[70,100],[510,100],[510,630],[70,630]], "#f8f1dc", 110, 0.15);
  ln(290,95,290,635,"#8a6a4c",1.8); ln(65,360,515,360,"#8a6a4c",1.8);
  outline([[60,90],[520,90],[520,640],[60,640]],"#7a5a3e",2);
  poly([[40,60],[250,60],[220,660],[30,660]], "#fffaf0", 150, 0.12);
  poly([[330,60],[540,60],[540,660],[360,660]], "#fffaf0", 150, 0.12);
  randomSeed(3);
  for(let i=0;i<90;i++){ const x=40+random(500), y=70+random(580); if(x>250&&x<330) continue; brush.noFill(); brush.set("HB","#d9ccb0",0.5); brush.circle(x,y,4+random(5)); }
  // подоконник и герань
  poly([[40,640],[540,640],[555,672],[25,672]], "#c99a6a", 220, 0.04);
  poly([[110,575],[200,575],[188,640],[122,640]], "#b5583a", 220, 0.04);
  poly([[330,575],[420,575],[408,640],[342,640]], "#b5583a", 220, 0.04);
  for(let i=0;i<24;i++){ circ(110+random(90), 520+random(60), 14+random(10), "#5c8a45", 180, 0.05); circ(330+random(90), 520+random(60), 14+random(10), "#5c8a45", 180, 0.05); }

  poly([[722,142],[978,142],[978,328],[722,328]], "#9cb7c9", 200, 0.05);
  poly([[722,250],[978,230],[978,328],[722,328]], "#d7b98a", 200, 0.05);
  poly([[760,250],[800,180],[840,245]], "#e9dcc2", 220, 0.03); poly([[860,240],[900,170],[945,235]], "#efe2c8", 220, 0.03);
  // торшер-бра
  circ(1110,250,40,"#f9d98a",200,0.1); circ(1110,250,95,"#fbe7b0",50,0.3);
  // сервант справа
  poly([[1450,40],[1900,40],[1900,760],[1450,760]], "#6b3b22", 235, 0.04);
  poly([[1480,70],[1870,70],[1870,730],[1480,730]], "#8a5332", 200, 0.05);
  poly([[1500,90],[1850,90],[1850,710],[1500,710]], "#f3e2bf", 140, 0.1);
  for(let y of [300,510]) poly([[1500,y],[1850,y],[1850,y+10],[1500,y+10]], "#c9a46a", 220, 0.02);
  randomSeed(8);
  for(let row=0;row<3;row++){ const yb=[290,500,700][row];
    for(let k=0;k<4;k++){ const x=1545+k*85; circ(x,yb-45,46,"#fbf6ec",240,0.03); circ(x,yb-45,46,"#d9a94a",0,0); brush.noFill(); brush.set("HB","#c9a03c",0.8); brush.circle(x,yb-45,44);
      circ(x-8,yb-52,8,"#e58aa0",220,0.03); circ(x+9,yb-40,7,"#e58aa0",220,0.03); } }
  ln(1675,70,1675,730,"#5a311c",1.5);
  // растение
  for(let i=0;i<20;i++) circ(1300+random(110), 520+random(140), 16+random(10), "#6f9a52", 170, 0.05);
  poly([[1310,650],[1400,650],[1390,740],[1320,740]], "#a8673f", 220, 0.03);
};

L.table = () => {

  const top=[[-30,770],[1950,770],[1950,1100],[-30,1100]];

  randomSeed(11);

  // фестоны края
  for(let x=-30;x<1950;x+=60){ brush.noFill(); brush.set("HB","#d8c6a2",0.8); brush.arc(x+30,772,30,0,PI); }
  // чайник слева
  poly(ell(250,820,120,95,30),"#fbf6ec",245,0.03); outline(ell(250,820,120,95,30),"#c9a03c",1.2);
  poly([[200,730],[300,730],[290,705],[210,705]],"#fbf6ec",245,0.03); circ(250,695,18,"#d9a94a",240,0.02);
  spl([[370,800],[430,770],[450,730]],"#c9a03c",3); spl([[130,780],[95,820],[135,860]],"#c9a03c",3);
  for(let i=0;i<7;i++) circ(190+random(120),790+random(60),12,"#e58aa0",220,0.03);
  // тарелка с выпечкой в центре
  poly(ell(960,900,260,60,34),"#f6ecd8",245,0.03); outline(ell(960,900,260,60,34),"#c9a03c",1.4);
  for(let i=0;i<9;i++){ const x=780+ (i%5)*85 + (i>4?40:0), y=(i>4?855:880); poly(ell(x,y,62,34,20),"#d79a4e",240,0.05); circ(x-10,y-12,18,"#efc07a",160,0.1); for(let k=0;k<6;k++) circ(x-35+random(70),y-20+random(20),2,"#fff7e0",255,0); }
  // вазочка с вареньем
  poly(ell(1290,930,90,40,24),"#e9e2e6",200,0.03); poly(ell(1290,920,75,28,24),"#b0122a",230,0.03);
  // чашки
  for(const [x,y] of [[560,960],[1600,950]]){ poly(ell(x,y+30,95,25,24),"#fbf6ec",245,0.03); outline(ell(x,y+30,95,25,24),"#c9a03c",1);
    poly([[x-60,y-50],[x+60,y-50],[x+45,y+20],[x-45,y+20]],"#fbf6ec",245,0.03); outline([[x-60,y-50],[x+60,y-50],[x+45,y+20],[x-45,y+20]],"#c9a03c",1);
    spl([[x+58,y-35],[x+90,y-20],[x+50,y+5]],"#c9a03c",2); circ(x-10,y-15,12,"#e58aa0",220,0.03); circ(x+15,y-25,9,"#e58aa0",220,0.03); }
  // букет полевых цветов справа
  for(let i=0;i<30;i++) circ(1780+random(130), 650+random(130), 12+random(8), ["#f2c94c","#ffffff","#9b6fd1","#f2c94c"][i%4], 220, 0.03);
  for(let i=0;i<12;i++) ln(1800+random(90),720+random(40),1840,880,"#5c8a45",1);
  poly([[1800,820],[1880,820],[1870,930],[1810,930]],"#e8f0f2",180,0.03);
};

L.izya = () => {
  // халат бордовый бархат
  const robe=torso(300,440,175,235);
  poly(robe,"#6e1b2c",235,0.05); outline(robe,"#3a0d18",1.2);
  // тёмно-синяя рубашка (V)
  poly([[240,450],[360,450],[330,640],[270,640]],"#1f2846",240,0.03);
  ln(240,450,300,620,"#8a1f30",1.4); ln(360,450,300,620,"#8a1f30",1.4);
  ln(232,470,180,1000,"#3a0d18",1); ln(368,470,420,1000,"#3a0d18",1);
  // дальняя рука на столе (слева)
  poly([[120,500],[180,500],[200,760],[130,770]], "#661a2a", 230, 0.04);
  // шея
  poly([[268,375],[332,375],[338,450],[262,450]], "#e3b291", 235, 0.03);
  // голова
  const face=ell(300,300,84,100,32);
  poly(face,"#efc3a0",240,0.03); outline(face,"#6b4a3a",0.9);
  circ(212,310,17,"#e6b392",235,0.02); circ(388,310,17,"#e6b392",235,0.02);
  // седые волосы (зачёс, пышные по бокам)
  randomSeed(6);
  for(let i=0;i<20;i++){ const a=PI*1.05+(i/19)*PI*0.9; const r=88+random(10); circ(300+r*cos(a), 292+r*sin(a)*0.85, 22+random(10), random()<0.5?"#d9d6d0":"#bdb9b2", 235, 0.04); }
  for(let k=0;k<8;k++) spl([[220+k*20,240],[250+k*20,215],[290+k*18,212]],"#9e9a93",0.8);
  // очки
  brush.noFill(); brush.set("HB","#5a4a3a",1.2); brush.circle(270,305,28); brush.circle(336,305,28);
  ln(298,303,308,303,"#5a4a3a",1.1); ln(242,300,214,296,"#5a4a3a",1); ln(364,300,388,296,"#5a4a3a",1);
  circ(276,307,6,"#2a1f1c",255,0); circ(342,307,6,"#2a1f1c",255,0);
  circ(278,305,2,"#ffffff",255,0); circ(344,305,2,"#ffffff",255,0);
  ln(246,270,288,264,"#a9a59f",2); ln(316,264,358,270,"#a9a59f",2);
  spl([[306,310],[316,338],[304,346]],"#8a5a44",1.1);
  // усы
  poly([[258,356],[302,344],[344,356],[334,372],[302,362],[268,372]],"#cfcbc4",245,0.03);
  spl([[284,386],[302,392],[322,384]],"#8a4a3a",1.2);
  circ(252,348,15,"#e89a8a",70,0.2); circ(352,348,15,"#e89a8a",70,0.2);
  spl([[240,250],[262,256]],"#b58c74",0.6); spl([[338,256],[360,250]],"#b58c74",0.6); // морщинки
};

L.fira = () => {
  // блузка тёмно-синяя в цветы
  const bl=torso(300,445,170,225);
  poly(bl,"#262c4a",238,0.05);
  randomSeed(21);
  for(let i=0;i<110;i++){ const y=490+random(500); const t=(y-470)/530; const x0=135-40*t, x1=465+40*t; const x=x0+25+random(x1-x0-50);
    const k=random(); const col = k<0.4?"#d2452c": k<0.65?"#e7902c": k<0.82?"#5a7a3e":"#f0d9a6";
    circ(x,y, k<0.82? 10+random(10): 5+random(4), col, 205, 0.05); }
  outline(bl,"#151830",1.1);
  // воротник
  poly([[300,470],[230,455],[255,540]],"#2e3456",235,0.03); poly([[300,470],[370,455],[345,540]],"#2e3456",235,0.03);
  // шея и декольте
  poly([[266,380],[334,380],[345,470],[300,520],[255,470]],"#efbf9c",238,0.03);
  // жемчужное ожерелье
  for(let i=0;i<17;i++){ const a=PI*0.15+i/16*PI*0.7; circ(300+62*cos(a), 445+58*sin(a), 9, "#fbf6ea", 255, 0.02); }
  // брошь
  for(let a=0;a<6;a++) circ(380+13*cos(a*PI/3),580+13*sin(a*PI/3),8,"#fbf7ee",250,0.02);
  circ(380,580,6,"#e6c56a",250,0.02);
  // дальняя рука (справа) лежит на столе
  poly([[420,500],[478,500],[470,770],[400,770]], "#262c4a", 230, 0.04);
  // волосы сзади
  randomSeed(5);
  for(let i=0;i<30;i++){ const a=PI*0.85+random(PI*1.3); const r=100+random(28); circ(300+r*cos(a)*1.08, 300+r*sin(a)*0.95+20, 36+random(18), random()<0.6?"#b8401a":"#d05a22", 225, 0.04); }
  // лицо
  const face=ell(300,315,84,98,32);
  poly(face,"#f2c6a5",242,0.03); outline(face,"#7a4a38",0.9);
  // кудри
  randomSeed(7);
  for(let i=0;i<24;i++){ const a=PI*1.03+(i/23)*PI*0.94; const r=94+random(16); circ(300+r*cos(a), 300+r*sin(a)*0.9+8, 30+random(12), random()<0.5?"#c4461a":"#9a3412", 232, 0.04); }
  for(let i=0;i<8;i++) circ(232+i*19, 224+random(10), 23, random()<0.5?"#c4461a":"#d8602a", 232, 0.04);
  for(let i=0;i<14;i++){ const a=PI*1.03+random(PI*0.94); brush.noFill(); brush.set("HB","#76280c",0.8); brush.circle(300+100*cos(a),300+100*sin(a)*0.9+8,9+random(7)); }
  // глаза — лукавый взгляд влево
  circ(266,318,7,"#2a1f1c",255,0); circ(328,318,7,"#2a1f1c",255,0);
  circ(264,316,2,"#ffffff",255,0); circ(326,316,2,"#ffffff",255,0);
  ln(250,308,282,304,"#2a1f1c",1.3); ln(312,304,344,308,"#2a1f1c",1.3);
  spl([[248,290],[266,281],[286,287]],"#8a3a18",1.4); spl([[312,287],[332,281],[350,290]],"#8a3a18",1.4);
  spl([[296,322],[290,346],[300,350]],"#9a5f48",1);
  poly([[274,370],[300,363],[326,370],[312,386],[288,386]],"#c4162b",248,0.02);
  circ(248,350,19,"#ee8f86",95,0.2); circ(352,350,19,"#ee8f86",95,0.2);
  // золотые серьги
  circ(214,362,13,"#d9a83a",255,0.02); circ(386,362,13,"#d9a83a",255,0.02);
  circ(211,358,4,"#fff1c0",255,0); circ(383,358,4,"#fff1c0",255,0);
};

// рука Изи: плечо (pivot) в (50,70), кисть ~ (330,70)
L.izya_arm = () => {
  const a=[[30,38],[300,50],[305,94],[30,108]];
  poly(a,"#6e1b2c",238,0.04); outline(a,"#3a0d18",1);
  poly([[288,48],[316,50],[316,94],[288,96]],"#1f2846",238,0.02); // манжета рубашки
  circ(338,72,30,"#efc4a2",240,0.03); outline(ell(338,72,30,30,18),"#7a4a38",0.7);

// рука Фиры: плечо (pivot) в (330,70), кисть ~ (45,70)
L.fira_arm = () => {
  const a=[[350,40],[80,52],[75,92],[350,105]];
  poly(a,"#262c4a",238,0.04);
  randomSeed(3); for(let i=0;i<12;i++) circ(110+random(220),58+random(36),8,random()<0.5?"#d2452c":"#e7902c",205,0.05);

// цветок: ножка снизу (90,260) -> бутон (90,75)
L.flower = () => {
  spl([[90,265],[86,180],[92,110]],"#3f6b35",2.4,"charcoal");
  poly([[88,190],[40,160],[60,200]],"#5c8a45",220,0.04);
  poly([[90,160],[140,135],[122,175]],"#5c8a45",220,0.04);
  circ(90,78,52,"#c81d36",210,0.05);
  circ(90,74,38,"#a8122a",200,0.05);
  circ(84,70,22,"#d9364d",220,0.03);
  brush.noFill(); brush.set("HB","#6d0a1a",1); brush.circle(90,74,14); brush.circle(92,72,30);
};
L.donut = () => {
  circ(90,90,70,"#d39a55",235,0.04);
  circ(90,86,58,"#f08cb2",235,0.06);
  randomSeed(2);
  for(let i=0;i<26;i++){ const a=random(TWO_PI), r=30+random(22); const x=90+r*cos(a), y=86+r*sin(a);
    const c=["#ffffff","#5bc0de","#f7d046","#7ac36a","#ff7a45"][i%5]; ln(x,y,x+6*cos(a*3),y+6*sin(a*3),c,1.6,"pen"); }
  circ(90,90,22,"#b0783c",255,0.02); // край дырки (сама дырка вырезается в компоновщике)
};
L.heart = () => {
  const p=[]; for(let i=0;i<=40;i++){ const t=i/40*TWO_PI; const x=16*pow(sin(t),3); const y=-(13*cos(t)-5*cos(2*t)-2*cos(3*t)-cos(4*t)); p.push([75+x*4,68+y*4]); }
  poly(p,"#d7263d",230,0.06);
};
L.end = () => {
  flat([[0,0],[1920,0],[1920,1080],[0,1080]], "#f6ecdc");
  randomSeed(31);
  circ(380,300,260,"#f2b8a6",70,0.25); circ(1560,820,300,"#f3d29a",70,0.25);
  circ(1650,240,170,"#e7a0a8",60,0.25); circ(300,860,200,"#cfdcb8",60,0.25);
  poly([[560,700],[1360,690],[1370,706],[550,716]],"#c4162b",160,0.05);
};

function setup(){ createCanvas(CW,CH,WEBGL); pixelDensity(1); noiseSeed(7); randomSeed(7); noLoop(); }
function draw(){ clear(); brush.scaleBrushes(1.4); push(); translate(-CW/2,-CH/2); L[LAYER](); pop(); window.DONE=true; }
</script></body></html>
