<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const FPS=25, DUR=21.0;
const OLD=[0,1.0,5.0,8.4,11.6,14.6,15.6,18.4,19.0], NEW=[0,1.0,5.6,9.7,13.4,16.7,17.6,20.3,21.0];
function warp(tn){ for(let i=1;i<NEW.length;i++){ if(tn<=NEW[i]){ const k=(tn-NEW[i-1])/(NEW[i]-NEW[i-1]); return OLD[i-1]+k*(OLD[i]-OLD[i-1]); } } return OLD[OLD.length-1]; }
function talkOf(who,tn){ for(const [st,e] of (MOUTH[who]||[])){ const i=Math.floor((tn-st)*FPS); if(i>=0&&i<e.length) return e[i]; } return 0; }
let TN=0;
const T = { n1:1.0, flowerUp:4.6, n2:5.0, firaTake:5.8, swap:6.7, n3:8.4, donutUp:8.6, izyaTake:9.4, swap2:10.3, f1:11.6, hearts:12.0, endIn:14.6, e1:15.6, fadeOut:18.4 };
const names=['bg','table','end','izya','fira','izya_arm','fira_arm','flower','donut','heart'];
const IMG={}; let MOUTH={};
const ctx=document.getElementById('c').getContext('2d');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const seg=(t,a,b)=>ease((t-a)/(b-a));          // 0..1 на отрезке [a,b]
const lerp=(a,b,k)=>a+(b-a)*k;
const rad=d=>d*Math.PI/180;

// Мир: Изя X=240, Фира X=1085, оба Y=60 (слои 600x1000)
const IZ={x:240,y:60}, FI={x:1085,y:60};
const S_I={x:IZ.x+475,y:IZ.y+530}, S_F={x:FI.x+130,y:FI.y+530};  // плечи
const ARM=288;
function handI(th){return {x:S_I.x+ARM*Math.cos(rad(th)), y:S_I.y+ARM*Math.sin(rad(th))};}
function handF(th){return {x:S_F.x-ARM*Math.cos(rad(th)), y:S_F.y-ARM*Math.sin(rad(th))};}

function drawImg(im,x,y,rot=0,px=0,py=0,sc=1,alpha=1){ ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y); ctx.rotate(rad(rot)); ctx.scale(sc,sc); ctx.drawImage(im,-px,-py); ctx.restore(); }
function blink(t,seed){ const p=4.1+seed; const ph=(t+seed*1.7)%p; return ph<0.14; }
function lid(cx,cy,skin){ ctx.fillStyle=skin; ctx.beginPath(); ctx.ellipse(cx,cy,10,9,0,0,7); ctx.fill(); ctx.strokeStyle='#2a1f1c'; ctx.lineWidth=2.2; ctx.beginPath(); ctx.moveTo(cx-9,cy+1); ctx.quadraticCurveTo(cx,cy+5,cx+9,cy+1); ctx.stroke(); }

function scene(t){
  ctx.drawImage(IMG.bg,0,0);
  // дыхание и покачивание
  const bI=Math.sin(t*2.1)*3, bF=Math.sin(t*1.9+1)*3;
  const talk=talkOf('fira',TN), talkI=talkOf('izya',TN);
  const leanI = 8*seg(t,T.flowerUp,T.flowerUp+1) - 8*seg(t,7.0,8.0) + 6*seg(t,T.izyaTake,T.izyaTake+.8);
  const leanF = -8*seg(t,T.firaTake,T.firaTake+.8) + 8*seg(t,7.2,8.2) - 6*seg(t,T.donutUp,T.donutUp+.8) + 6*seg(t,10.6,11.4);
  const izX=IZ.x+leanI, izY=IZ.y+bI-talkI*4, fiX=FI.x+leanF, fiY=FI.y+bF - talk*6;

  // руки: углы (Изя: + вниз; Фира: + вверх)
  let thI=70; thI=lerp(thI,-20,seg(t,T.flowerUp,T.flowerUp+1.0)); thI=lerp(thI,70,seg(t,7.0,7.9));
  thI=lerp(thI,-20,seg(t,T.izyaTake,T.izyaTake+.8)); thI=lerp(thI,-48,seg(t,10.5,11.2)); thI=lerp(thI,-40+Math.sin(t*9)*4, seg(t,11.2,11.4)*(t<14?1:0));
  let thF=-70; thF=lerp(thF,20,seg(t,T.firaTake,T.firaTake+.8)); thF=lerp(thF,48,seg(t,6.9,7.6)); thF=lerp(thF,-70,seg(t,8.0,8.5));
  thF=lerp(thF,20,seg(t,T.donutUp,T.donutUp+.8)); thF=lerp(thF,-70,seg(t,10.6,11.4));

  // тела
  drawImg(IMG.izya, izX, izY);
  drawImg(IMG.fira, fiX, fiY);
  // губы Фиры: открываются в такт речи
  if(talk>0.05){ ctx.fillStyle='#5a0a14'; ctx.beginPath(); ctx.ellipse(fiX+300,fiY+378,15,3+talk*9,0,0,7); ctx.fill();
    ctx.fillStyle='#c4162b'; ctx.beginPath(); ctx.ellipse(fiX+300,fiY+370-talk*2,22,4,0,0,7); ctx.fill(); }
  // рот Изи под усами
  if(talkI>0.05){ ctx.fillStyle='#4a0f14'; ctx.beginPath(); ctx.ellipse(izX+302,izY+386,13,2+talkI*8,0,0,7); ctx.fill(); }
  // моргание
  if(blink(t,0)){ lid(izX+276,izY+307,'#efc3a0'); lid(izX+342,izY+307,'#efc3a0'); }
  if(blink(t,1.3)||(t>T.swap&&t<T.swap+0.25)){ lid(fiX+266,fiY+318,'#f2c6a5'); lid(fiX+328,fiY+318,'#f2c6a5'); }

  // руки поверх тел
  const sI={x:S_I.x+leanI,y:S_I.y+bI-talkI*4}, sF={x:S_F.x+leanF,y:S_F.y+bF-talk*6};
  drawImg(IMG.izya_arm, sI.x, sI.y, thI, 50, 70);
  drawImg(IMG.fira_arm, sF.x, sF.y, thF, 330, 70);
  const hI={x:sI.x+ARM*Math.cos(rad(thI)), y:sI.y+ARM*Math.sin(rad(thI))};
  const hF={x:sF.x-(ARM-3)*Math.cos(rad(thF)), y:sF.y-(ARM-3)*Math.sin(rad(thF))};

  // цветок: у Изи -> у Фиры -> лежит на столе
  if(t>=T.flowerUp && t<8.5){ const h = t<T.swap? hI : hF; drawImg(IMG.flower, h.x, h.y+12, (t<T.swap? 8:-12), 90, 232); }
  // пончик: у Фиры -> у Изи
  if(t>=T.donutUp){ const h = t<T.swap2? hF : hI; const bite = t>11.4&&t<14? Math.sin(t*9)*3:0; drawImg(IMG.donut, h.x, h.y-40+bite, 0, 90, 90, 0.9); }

  ctx.drawImage(IMG.table,0,0);
  // цветок, положенный на стол перед Фирой
  if(t>=8.5){ drawImg(IMG.flower, 1330, 850, -78, 90, 232, 1, clamp((t-8.5)/0.35)); }

  // сердечки
  if(t>T.hearts){ for(let i=0;i<7;i++){ const st=T.hearts+i*0.35; const k=(t-st)/2.6; if(k<0||k>1) continue;
    const x=960+Math.sin(i*2.3+k*6)*90+(i%2?60:-60), y=560-k*420; drawImg(IMG.heart,x,y,Math.sin(k*8)*10,75,68,0.45+0.35*Math.sin(k*3.14),Math.sin(k*3.14)); } }
}

function endCard(t){
  ctx.drawImage(IMG.end,0,0);
  const k=seg(t,T.endIn+0.4,T.endIn+1.4);
  drawImg(IMG.flower, 860, 420, -20, 90, 232, 0.9, k);
  drawImg(IMG.donut, 1060, 360, 0, 90, 90, 0.85, k);
  ctx.save(); ctx.globalAlpha=seg(t,T.e1-0.4,T.e1+0.5); ctx.fillStyle='#7d1020'; ctx.textAlign='center';
  ctx.font='600 104px "Noto Serif", serif'; ctx.fillText('Лучший банк', 960, 560);
  ctx.font='600 104px "Noto Serif", serif'; ctx.fillText('для бизнеса', 960, 675);
  ctx.restore();
}

window.render=(tn)=>{ TN=tn; const t=warp(tn);
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#000'; ctx.fillRect(0,0,1920,1080);
  const z=1+0.06*seg(t,0,T.endIn);       // медленный наезд камеры
  ctx.setTransform(z,0,0,z,960*(1-z),540*(1-z)); scene(t);
  ctx.setTransform(1,0,0,1,0,0);
  const e=seg(t,T.endIn,T.endIn+0.8); if(e>0){ ctx.save(); ctx.globalAlpha=e; endCard(t); ctx.restore(); }
  const f=1-seg(t,0,0.6)+seg(t,T.fadeOut,DUR); if(f>0){ ctx.fillStyle=`rgba(0,0,0,${clamp(f)})`; ctx.fillRect(0,0,1920,1080); }
};

(async()=>{
  await Promise.all(names.map(n=>new Promise(r=>{const i=new Image(); i.onload=()=>{IMG[n]=i;r();}; i.src='layers/'+n+'.png';})));
  // дырка пончика
  const c=document.createElement('canvas'); c.width=180; c.height=180; const x=c.getContext('2d'); x.drawImage(IMG.donut,0,0);
  x.globalCompositeOperation='destination-out'; x.beginPath(); x.arc(90,90,17,0,7); x.fill(); IMG.donut=c;
  MOUTH=window.MOUTH_DATA||{};
  await document.fonts.load('600 104px "Noto Serif"');
  window.READY=true;
})();
</script></body></html>
